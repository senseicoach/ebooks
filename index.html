<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>executiveclass.ca</title>
<meta name="description" content="Course materials by Ron Taylor for professionals investing in their success.">
<meta property="og:title" content="executiveclass.ca">
<meta property="og:site_name" content="executiveclass.ca">
<meta property="og:description" content="Course materials for professionals investing in their success.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#16202e; --muted:#5d6675; --line:#e3ddcf;
  --navy:#14213a; --gold:#c9a24a; --gold-ink:#8a6a1f; --gold-title:#a8822c; --focus:#2b5bd7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1520; --paper:#161e2c; --ink:#ece7dc; --muted:#a3abb8; --line:#273145;
         --navy:#0b111b; --gold:#d8b45e; --gold-ink:#e3c477; --gold-title:#d8b45e; --focus:#7aa2ff; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header.hero{padding:44px 0 4px;text-align:left}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
a.site{color:var(--gold-title);text-decoration:none}a.site:hover{text-decoration:underline}
.lede{margin:0;color:var(--gold-ink);font-size:17px;font-weight:500;white-space:nowrap;display:inline-block}
header.hero h1{display:inline-block;margin-bottom:4px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:28px 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:14px}

.feature{margin:28px 0 4px;background:#000;color:#f3eee3;border-radius:14px;overflow:hidden;display:flex;align-items:center;gap:24px;padding:18px 24px;box-shadow:0 12px 28px -18px rgba(0,0,0,.6)}
.feature .art{flex:0 0 auto;display:block}
.feature .art img{display:block;height:120px;width:auto}
.feature .txt{flex:1;min-width:0}
.feature .kicker{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#c9a24a}
.feature h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;line-height:1.15;margin:4px 0 6px}
.feature h2 a{color:inherit;text-decoration:none}
.feature p{color:#bdb7aa;font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feature .actions{flex:0 0 auto;display:flex;gap:8px;margin-top:0}
.feature .btn{flex:0 0 auto}
.feature .btn.primary{background:#c9a24a;color:#14140f}
.feature .btn.ghost{border-color:#3a3934;color:#f3eee3}
@media (max-width:820px){.feature{flex-wrap:wrap;gap:12px 14px;padding:16px}.feature .art img{height:72px}.feature h2{font-size:19px}.feature .actions{width:100%;flex-direction:row !important}.feature .btn.primary{flex:1}.feature .btn.ghost{flex:0 0 auto !important}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 24px;padding:16px 0 48px}
.book{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;display:flex;flex-direction:column;transition:box-shadow .2s, transform .2s;scroll-margin-top:24px}
.book:hover{box-shadow:0 10px 30px -12px rgba(20,33,58,.35);transform:translateY(-2px)}
.book h2 a{text-decoration:none}.book h2 a:hover{text-decoration:underline}
.cover{display:block;aspect-ratio:2/3;width:100%;border-radius:6px;overflow:hidden;background:#d9d3c4;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 18px -10px rgba(0,0,0,.5)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.lang{display:inline-block;margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.book h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;line-height:1.2;margin:6px 0 6px}
.book p{color:var(--muted);font-size:14px;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.actions{margin-top:auto;display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border-radius:9px;padding:10px 12px;font:600 14px Inter,sans-serif;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--navy);color:#f3eee3}
@media (prefers-color-scheme: dark){ .btn.primary{background:var(--gold);color:#14213a} }
.btn.ghost{flex:0 0 auto;background:transparent;border-color:var(--line);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.size{font-weight:400;opacity:.75}

section.help{border-top:1px solid var(--line);padding:40px 0 56px}
section.help h3{font-family:Fraunces,Georgia,serif;font-size:26px;margin:0 0 18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.step b{display:block;margin-bottom:6px}
.step p{margin:0;color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
.brandfoot{text-align:center;padding:8px 0 48px}.brandfoot .seal{display:inline-block;margin-bottom:14px;border-radius:50%;box-shadow:0 10px 26px -14px rgba(0,0,0,.6)}.brandfoot .seal img{display:block;width:140px;height:140px}
@media (max-width:540px){
  header.hero{padding:28px 0 0}
  .grid{grid-template-columns:1fr 1fr;gap:16px 12px}
  .book{padding:10px 10px 12px}
  .book h2{font-size:16px}
  .book p{display:none}
  .actions{flex-direction:column;gap:6px}
  .btn.ghost{flex:1}
  .size{display:none}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1 id="brand"><a class="site" href="https://executiveclass.ca">executiveclass.ca</a></h1><br>
    <p class="lede" id="tagline">Course materials for professionals investing in their success.</p>
  </div>
</header>

<main class="wrap">
  <section class="feature" id="feature"></section>
  <div class="bar">
    <div class="filters" role="group" aria-label="Filter by language">
      <button class="chip" data-f="all" aria-pressed="true">All books</button>
      <button class="chip" data-f="en" aria-pressed="false">English</button>
      <button class="chip" data-f="pt" aria-pressed="false">Português</button>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>
  <footer class="brandfoot">
    <a href="https://executiveclass.ca" class="seal" aria-label="Executive Class: executiveclass.ca"><img src="covers/executiveclass-logo.png?v=1" alt="Executive Class logo" width="140" height="140"></a>
    <div>© Ron Taylor · <a href="https://executiveclass.ca">executiveclass.ca</a></div>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// To add a book: put the .epub in /books and the cover in /covers (same name), then add a line here.
// Changes whenever a cover changes, so browsers fetch the new image instead of an old saved copy.
const V = "b148ffc6";
const BOOKS = [
  {id:"the-canadian-networking-code", title:"The Canadian Networking Code", lang:"pt", kb:1057,
   desc:"Como profissionais brasileiros transformam experiência em oportunidade no Canadá. Inclui 100 scripts práticos e um plano de 30/60/90 dias."},
  {id:"the-brazucan-pathway", title:"The Brazucan Pathway", lang:"pt", kb:1160,
   desc:"Um GPS psicológico para construir a sua vida no Canadá: do choque de status ao luto à distância, à reconstrução profissional e ao pertencimento."},
  {id:"comece-com-tudo", title:"Comece com Tudo", lang:"pt", kb:449,
   desc:"Guia bilíngue de preparação para a universidade no Canadá: explicações em português, modelos em inglês."},
  {id:"52-hours-to-a-winning-interview", title:"52 Hours to a Winning Interview", lang:"en", kb:269,
   desc:"Fifty-two cases, strong answers taken apart, and the words, sounds and documents that decide an interview. For Brazilians building careers in Canada."},
  {id:"why-you-the-art-of-the-interview", title:"Why You? The Art of the Interview", lang:"en", kb:457,
   desc:"Every interview question is the same question in a different costume. Know your value, prove it, communicate it."},
  {id:"blue-ocean", title:"Blue Ocean: 52 Case Studies in Uncontested Market Strategy", lang:"en", kb:1136,
   desc:"From Cirque du Soleil and Southwest Airlines to Nubank and Havaianas, each case unpacked with the Eliminate-Reduce-Raise-Create grid, vocabulary, practice tasks and an answer key."},
  {id:"remarkable-canadians", title:"Remarkable Canadians: 52 Lives That Shaped a Nation", lang:"en", kb:340,
   desc:"Fifty-two profiles of significant Canadians, with a citizenship practice quiz."},
  {id:"first-principles", title:"First Principles", lang:"en", kb:988,
   desc:"52 stories about thinking differently: a reading and critical-thinking course for advanced ESL and Business English learners."},
  {id:"wise-up", title:"Wise Up", lang:"en", kb:970,
   desc:"Decisions that made history: fifty-two case studies in disaster, decision-making, organizational collapse and recovery."},
  {id:"natures-business-model", title:"Nature's Business Model", lang:"en", kb:992,
   desc:"52 principles from nature for building better organizations: short case studies tracing mechanisms in the natural world into working principles."},
  {id:"the-intimacies-of-ritual", title:"The Intimacies of Ritual", lang:"en", kb:2114,
   desc:"52 customs from around the world, arranged not by geography but by the human questions they answer."},
  {id:"crisis-management", title:"Crisis Management: 52 Case Studies in Turning Breakdown into Breakthrough", lang:"en", kb:2003,
   desc:"Corporate pivots, PR and cyber-security recoveries, brand re-imagination and personal reinvention: fifty-two case studies organized into six parts."},
  {id:"shadows-in-the-cave", title:"Shadows in the Cave: 52 Thinking Tools for Navigating Your World", lang:"en", kb:1284,
   desc:"Fifty-two classic thought experiments, from Plato's Cave to Asimov's Last Question, each with a real-world professional application, vocabulary and discussion practice."},
  {id:"humanities-business-school", title:"The Humanities Business School", lang:"en", kb:1013,
   desc:"52 lessons from philosophy, literature and social thought: what great thinkers and writers still have to teach a working career."},
  {id:"masterclass", featured:true, title:"The Canadian Dream: Masterclass", lang:"en", kb:2539,
   desc:"Decoding English for Brazilian professionals, business idioms and phrasal verbs, IELTS, CELPIP and PTE vocabulary, LinkedIn, interviews, citizenship and everyday life in Canada."},
];

const grid = document.getElementById('grid'), count = document.getElementById('count'), toast = document.getElementById('toast');
const label = {en:"English", pt:"Português"};
const fmt = kb => kb >= 1000 ? (kb/1024).toFixed(1)+" MB" : kb+" KB";
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const FEATURED = BOOKS.find(b => b.featured);
if(FEATURED){ const b = FEATURED; document.getElementById('feature').innerHTML = `
  <a class="art" href="${b.id}/"><img src="covers/${b.id}-logo.jpg?v=${V}" alt="${esc(b.title)}"></a>
  <div class="txt">
    <p>${esc(b.desc)}</p>
  </div>
  <div class="actions">
    <a class="btn primary" href="books/${b.id}.epub" download>Download <span class="size">· ${fmt(b.kb)}</span></a>
    <button class="btn ghost" data-share="${b.id}" aria-label="Copy link to ${esc(b.title)}">Link</button>
  </div>`; }
grid.innerHTML = BOOKS.filter(b => !b.featured).map(b => `
  <article class="book" id="${b.id}" data-lang="${b.lang}">
    <a class="cover" href="${b.id}/"><img src="covers/${b.id}.jpg?v=${V}" alt="Cover of ${esc(b.title)}" loading="lazy" width="560" height="840"></a>
    <span class="lang">${label[b.lang]}</span>
    <h2><a href="${b.id}/">${esc(b.title)}</a></h2>
    <p>${esc(b.desc)}</p>
    <div class="actions">
      <a class="btn primary" href="books/${b.id}.epub" download>Download <span class="size">· ${fmt(b.kb)}</span></a>
      <button class="btn ghost" data-share="${b.id}" title="Copy a link to this book" aria-label="Copy link to ${esc(b.title)}">Link</button>
    </div>
  </article>`).join('');

function show(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(show.t); show.t = setTimeout(()=>toast.classList.remove('show'), 1800); }

function applyFilter(f){
  let n = 0;
  document.querySelectorAll('.book').forEach(el => { const on = f === 'all' || el.dataset.lang === f; el.hidden = !on; if(on) n++; });
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === f));
  count.textContent = n + (n === 1 ? " book" : " books");
}
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => applyFilter(c.dataset.f)));
applyFilter('all');

document.querySelector('main').addEventListener('click', async e => {
  const b = e.target.closest('[data-share]'); if(!b) return;
  const url = location.origin + location.pathname.replace(/index\.html$/,'') + b.dataset.share + '/';
  try { await navigator.clipboard.writeText(url); show('Link copied'); }
  catch { prompt('Copy this link:', url); }
});

// Old-style links (…/ebooks/#wise-up) go straight to that book's own page.
function toBookPage(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id && BOOKS.some(b => b.id === id)) location.replace(location.pathname.replace(/index\.html$/,'') + id + '/');
}
window.addEventListener('hashchange', toBookPage); toBookPage();

// Size the tagline so it is exactly as wide as "executiveclass.ca" above it.
function fitTagline(){
  const brand = document.querySelector('#brand a'), tag = document.getElementById('tagline');
  tag.style.whiteSpace = 'nowrap'; tag.style.width = 'auto'; tag.style.fontSize = '20px';
  const w = brand.getBoundingClientRect().width, tw = tag.getBoundingClientRect().width;
  if (!w || !tw) return;
  const fs = 20 * w / tw;
  if (fs >= 12) { tag.style.fontSize = fs.toFixed(2) + 'px'; }
  else { tag.style.whiteSpace = 'normal'; tag.style.width = w + 'px'; tag.style.fontSize = '13px'; } // small phones: wrap within the same width
}
fitTagline(); window.addEventListener('resize', fitTagline);
if (document.fonts) document.fonts.ready.then(fitTagline);
</script>
</body>
</html>
